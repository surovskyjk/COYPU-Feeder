<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  /* Theme colours are pushed from Python (MapWidget._push_page_theme) so
     gui/theme_manager.py stays the single source of truth. The values here
     are the dark defaults that apply until that first call lands. */
  :root {
    --bg:     #1a1a1a;
    --panel:  rgba(30,30,30,0.92);
    --fg:     #f0f0f0;
    --border: #555555;
    --accent: #ffd54f;
    --ok:     #43a047;
    --muted:  #757575;
    --link:   #1e88e5;
  }
  html, body, #map { width:100%; height:100%; margin:0; padding:0; background:var(--bg); }
  .aln-tip {
    background: var(--panel);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: "Segoe UI", "Helvetica Neue", sans-serif;
    font-size: 11px;
    padding: 6px 8px;
    line-height: 1.4;
  }
  .aln-tip b { color: var(--accent); }
  .aln-tip span { color: var(--muted); }

  .legend-box { padding: 8px 10px; line-height: 1.6; }
  .legend-row { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .legend-swatch {
    display: inline-block; width: 16px; height: 3px; border-radius: 1.5px;
    flex: 0 0 auto;
  }
  .legend-swatch-dashed {
    background: none; height: 0; border-top: 3px dashed; width: 16px;
  }
  .legend-label { color: var(--fg); font-size: 11px; }

  /* PI edit-mode markers (Part H): hover "bounce" invites interaction;
     locked PIs must be unlocked (click the lock badge) before they can be
     dragged; unlocked PIs also show a small restore-to-baseline badge. */
  @keyframes pi-bounce {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.35); }
  }
  .pi-drag-icon .pi-dot {
    position: absolute; left: 4px; top: 4px;
    width: 10px; height: 10px; border-radius: 50%;
    transform-origin: center;
  }
  .pi-drag-icon .pi-dot:hover { animation: pi-bounce 0.6s ease-in-out infinite; }
  .pi-drag-icon .pi-badge {
    position: absolute; width: 11px; height: 11px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; line-height: 1; cursor: pointer;
    border: 1px solid rgba(0,0,0,0.4); box-shadow: 0 0 2px rgba(0,0,0,0.6);
  }
  .pi-drag-icon .pi-lock-badge    { right: -2px; bottom: -2px; background: var(--muted); color: #fff; }
  .pi-drag-icon .pi-lock-badge.unlocked { background: var(--ok); }
  .pi-drag-icon .pi-restore-badge { right: -2px; top: -2px; background: var(--link); color: #fff; }
</style>
<link rel="stylesheet" href="leaflet.css"/>
<script src="leaflet.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
<div id="map"></div>
<script>
"use strict";
/* fadeAnimation:false kills Leaflet's default tile cross-fade (the old tile
   layer fading out while the new one fades in is the main source of the
   "blink" reported on zoom); zoomAnimation stays on for a smooth zoom feel
   — the canvas renderer padding bump below (see _alnRenderer/_glowRenderer)
   is what keeps OUR polylines from visibly popping/clipping during that
   animated transition. */
/* preferCanvas routes every path layer without an explicit renderer into a
   per-pane canvas renderer instead of one SVG DOM node per polyline —
   tracks, candidates, the OSM reference and stations used to be SVG. */
var map = L.map('map', {
  zoomControl: true, fadeAnimation: false, markerZoomAnimation: true,
  preferCanvas: true,
}).setView([50.05, 14.42], 7);

/* Custom panes for z-ordering */
map.createPane('tracksPane').style.zIndex      = '410';
map.createPane('osmRefPane').style.zIndex      = '630';
map.createPane('candidatesPane').style.zIndex  = '620';
map.createPane('alignmentGlowPane').style.zIndex = '640';
map.createPane('alignmentPane').style.zIndex   = '650';
map.createPane('crossSectionPane').style.zIndex = '625';
/* piPane/stationPane hold interactive marker DOM, not canvas — they must sit
   ABOVE every preferCanvas vector pane above, or that pane's <canvas> (which
   has no per-pixel pointer-events, unlike SVG) physically intercepts clicks
   over the whole viewport before a marker/badge underneath ever sees them. */
map.createPane('piPane').style.zIndex          = '655';
map.createPane('stationPane').style.zIndex     = '660';
/* The vertical-profile hover dot: above everything, never clickable. */
map.createPane('cursorPane').style.zIndex      = '670';
map.getPane('cursorPane').style.pointerEvents  = 'none';

/* Canvas renderers for the alignment: a long line has hundreds of elements,
   and one SVG path per element makes pan/zoom crawl. Canvas draws them all
   into a single element while keeping mouse events and tooltips working.
   padding is how far beyond the viewport the canvas buffer extends; at the
   old 0.5 a pan or the CSS-transformed mid-zoom-animation frame could show
   the buffer's clipped edge before the next redraw caught up (visible as a
   blink/pop). 2.0 keeps a couple of extra viewports' worth rendered so that
   edge is essentially never on screen, at the cost of a larger offscreen
   canvas — negligible next to the per-element draw cost this already pays. */
var _alnRenderer  = L.canvas({ pane: 'alignmentPane',     padding: 2.0 });
var _glowRenderer = L.canvas({ pane: 'alignmentGlowPane', padding: 2.0 });
var _csRenderer   = L.canvas({ pane: 'crossSectionPane',  padding: 2.0 });
/* piPane/stationPane hold only a handful of shapes each (unlike the
   alignment's hundreds of elements, where canvas is the right call) — give
   them an EXPLICIT SVG renderer instead of falling through to preferCanvas's
   default. An SVG renderer sets pointer-events:none on its own root and
   opts individual shapes back in, so empty space is truly click-through;
   the default canvas renderer preferCanvas would otherwise create is one
   opaque, full-viewport element that swallows every click over it — the
   exact bug already fixed once for alignmentPane vs piPane (see the pane
   z-index comment above), which resurfaces at the NEXT pane up (station
   markers, sitting above piPane) the moment any station exists on the map
   at the same time PIs are being edited (Refine & Consolidate always shows
   both once a project has stations recorded). */
var _piRenderer      = L.svg({ pane: 'piPane' });
var _stationRenderer = L.svg({ pane: 'stationPane' });
var _cursorRenderer  = L.svg({ pane: 'cursorPane' });

var baseLayer       = null;
var railOverlay     = null;
var trackLayers     = [];
var osmRefLayers    = [];
var alignmentLayers = [];
var candidateLayers = [];
var candIndex       = {};    // algo_id → [glow, main] (card-hover emphasis)
var segIndex        = {};    // element_id → {main, glow, pts, col, selected}
var piLayers        = [];    // PI markers + dashed virtual tangents
var stationLayers   = [];    // station markers
var csLeftLayer     = null;
var csRightLayer    = null;
var backend         = null;
var _showRailOverlay = true;
var _hoverTimer     = null;
var _hoverPopup     = null;
var _stationClickMode = false;
var _splitClickMode = false;   // click-to-pick a Line-split point (Refine)

/* keepBuffer keeps extra rows/cols of tiles loaded outside the viewport so
   a pan doesn't show blank tiles while new ones fetch; updateWhenZooming:
   false defers loading new-zoom tiles until the zoom gesture settles
   instead of mid-animation, which is the other half (with fadeAnimation:
   false above) of removing the zoom "blink". */
var _TILE_ANTI_FLICKER = { keepBuffer: 4, updateWhenZooming: false };

/* ── Tile provider ─────────────────────────────────────────────── */
var _baseUrl = null;
function setTileProvider(url, subs, attr, maxZoom) {
  /* Re-applying the same provider (startup queue drain, theme re-push)
     used to tear down and refetch the whole basemap — visible blink. */
  if (baseLayer && url === _baseUrl) return;
  _baseUrl = url;
  if (baseLayer) { map.removeLayer(baseLayer); baseLayer = null; }
  var opts = Object.assign(
    { attribution: attr, maxZoom: maxZoom || 19 }, _TILE_ANTI_FLICKER);
  if (subs) opts.subdomains = subs;
  baseLayer = L.tileLayer(url, opts).addTo(map);
  /* Keep rail overlay on top if active */
  if (railOverlay) railOverlay.bringToFront();
}

/* ── OpenRailwayMap overlay ────────────────────────────────────── */
function setRailOverlay(show) {
  _showRailOverlay = show;
  if (show) {
    if (!railOverlay) {
      railOverlay = L.tileLayer(
        'https://{s}.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png',
        Object.assign({ subdomains:'abc', maxZoom:19, opacity:0.8,
          attribution:'© <a href="https://www.openrailwaymap.org/">OpenRailwayMap</a>' },
          _TILE_ANTI_FLICKER)
      ).addTo(map);
    }
  } else {
    if (railOverlay) { map.removeLayer(railOverlay); railOverlay = null; }
  }
}

/* ── ČÚZK land register (katastrální mapa) WMS overlay ────────────── */
var cadastreOverlay = null;
function setCadastreOverlay(show) {
  if (show) {
    if (!cadastreOverlay) {
      cadastreOverlay = L.tileLayer.wms('https://services.cuzk.cz/wms/wms.asp', {
        layers: 'KN', format: 'image/png', transparent: true, version: '1.3.0',
        minZoom: 15, maxZoom: 21,
        attribution: "<a href='https://cuzk.gov.cz/Predpisy/Podminky-poskytovani-prostor-dat-a-sitovych-sluzeb/Podminky-poskytovani-sitovych-sluzeb-CUZK.aspx'>ČÚZK – on-line</a>",
      });
    }
    cadastreOverlay.addTo(map);
  } else if (cadastreOverlay) {
    map.removeLayer(cadastreOverlay);
  }
}
function setCadastreOpacity(opacity) {
  if (cadastreOverlay) cadastreOverlay.setOpacity(opacity);
}

/* Load default tiles immediately */
setTileProvider(
  'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  '', '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', 19
);
setRailOverlay(true);

/* ── QWebChannel bootstrap ──────────────────────────────────────  */
new QWebChannel(qt.webChannelTransport, function(channel) {
  backend = channel.objects.backend;
  backend.on_ready();
});

/* ── Map bounds ─────────────────────────────────────────────────  */
function getMapBounds() {
  var b = map.getBounds();
  backend.on_bounds_ready(b.getSouth(), b.getWest(), b.getNorth(), b.getEast());
}

/* ── Track display ──────────────────────────────────────────────  */
/* fit=false keeps the user's current zoom/pan (track split/merge edits). */
function showTracks(tracks, fit) {
  if (fit === undefined) fit = true;
  trackLayers.forEach(function(l) { map.removeLayer(l); });
  trackLayers = [];
  var all = [];
  tracks.forEach(function(t) {
    var color   = t.color || MAP_COLORS.trackFallback;
    var latlngs = t.nodes.map(function(n) { return [n[0], n[1]]; });
    if (!latlngs.length) return;
    all = all.concat(latlngs);
    var pl = L.polyline(latlngs, {color:color, weight:4, opacity:0.9, pane:'tracksPane'});
    pl._baseColor = color;
    pl.addTo(map);
    trackLayers.push(pl);
  });
  if (all.length && fit)
    try { map.fitBounds(L.latLngBounds(all), {padding:[20,20], maxZoom:14}); } catch(e){}
}

function highlightTrack(idx) {
  trackLayers.forEach(function(l, i) {
    var base = l._baseColor || MAP_COLORS.trackFallback;
    if (idx < 0)       l.setStyle({color:base,    weight:4, opacity:0.9});
    else if (i===idx) { l.setStyle({color:MAP_COLORS.trackHighlight, weight:7, opacity:1.0}); l.bringToFront(); }
    else               l.setStyle({color:base,    weight:2, opacity:0.25});
  });
}

function flyToTracks() {
  var all = [];
  trackLayers.forEach(function(l){ all = all.concat(l.getLatLngs()); });
  if (all.length)
    try { map.flyToBounds(L.latLngBounds(all), {padding:[30,30], duration:0.8, maxZoom:14}); } catch(e){}
}

/* ── OSM reference overlay (dashed, user-configurable) ──────────  */
/* Part E: visibility/opacity/colour are user-editable (toolbar "Original…"
   popover) and persisted in Python prefs — applied here via setStyle on
   the existing layers (no redraw) and remembered so a later showOSMReference
   rebuild (new track / project load) picks the same look back up. */
/* color:null means "use MAP_COLORS.osmReference" - resolved at draw time
   because MAP_COLORS is populated after this statement runs. */
var _osmRefStyle = {visible: true, color: null, opacity: 0.85};

function showOSMReference(alns) {
  clearOSMReference();
  var st = _osmRefStyle;
  alns.forEach(function(aln) {
    var latlngs = aln.nodes.map(function(n){ return [n[0],n[1]]; });
    if (latlngs.length < 2) return;
    var pl = L.polyline(latlngs, {
      color: st.color || MAP_COLORS.osmReference, weight: 2, opacity: st.opacity,
      dashArray: '8 6', pane: 'osmRefPane'
    });
    if (st.visible) pl.addTo(map);
    osmRefLayers.push(pl);
  });
}

function clearOSMReference() {
  osmRefLayers.forEach(function(l){ try{ map.removeLayer(l); }catch(e){} });
  osmRefLayers = [];
}

/* Applied to the CURRENT layers via setStyle/add-remove — no redraw — and
   remembered for the next showOSMReference() rebuild. */
function setOSMReferenceStyle(visible, color, opacity) {
  _osmRefStyle = {visible: !!visible, color: color, opacity: opacity};
  osmRefLayers.forEach(function(pl) {
    pl.setStyle({color: color, opacity: opacity});
    var onMap = map.hasLayer(pl);
    if (visible && !onMap) pl.addTo(map);
    else if (!visible && onMap) map.removeLayer(pl);
  });
}

/* ── Fitted alignment overlay (solid red, or a muted "degraded" look) ── */
function showAlignment(alns, style) {
  clearAlignment();
  var all = [];
  // "degraded": an edit-driven refresh's segmented render failed and this
  // is an unplanned fallback (see App._sample_segments) — draw thin/muted
  // in a pane BELOW osmRefPane so it never buries the OSM reference the
  // way the bold "selected" preview (meant for candidate/export contexts,
  // where nothing else is competing for attention) deliberately does.
  var degraded = style === 'degraded';
  alns.forEach(function(aln) {
    var latlngs = aln.nodes.map(function(n){ return [n[0],n[1]]; });
    if (latlngs.length < 2) return;
    all = all.concat(latlngs);
    if (degraded) {
      var plain = L.polyline(latlngs, {
        color: MAP_COLORS.alignmentDegraded, weight: 3, opacity: 0.65,
        pane: 'candidatesPane'
      }).addTo(map);
      alignmentLayers.push(plain);
    } else {
      var glow = L.polyline(latlngs, {color:MAP_COLORS.glow, weight:14, opacity:0.2, pane:'alignmentGlowPane'}).addTo(map);
      var bright = L.polyline(latlngs, {color:MAP_COLORS.selected, weight:5, opacity:1.0, pane:'alignmentPane'}).addTo(map);
      alignmentLayers.push(glow);
      alignmentLayers.push(bright);
    }
  });
  if (all.length)
    try { map.flyToBounds(L.latLngBounds(all), {padding:[30,30], duration:0.8}); } catch(e){}
}

/* ── Per-element coloured alignment (Step 5+ and after export) ── */
/*
 * segments  : [{type:"Line"|"Arc"|"Spiral", points:[[lat,lon],...], params:{...}}, ...]
 *
 * Each element drawn as a separate coloured polyline with a sticky HTML
 * tooltip listing its parameters.
 */
/* Line / Spiral / Arc identity, pushed from gui/palette.py via
   setElementColors() before the first draw (MapWidget._on_map_ready). */
var ELEMENT_COLOR = {};
function setElementColors(colors) {
  if (colors) { ELEMENT_COLOR = colors; }
}

/* Every other colour the page draws with, also owned by gui/palette.py and
   pushed by MapWidget._push_page_theme() before the first draw. */
var MAP_COLORS = {};
function setMapColors(colors) {
  if (!colors) { return; }
  for (var key in colors) {
    if (Object.prototype.hasOwnProperty.call(colors, key)) {
      MAP_COLORS[key] = colors[key];
    }
  }
}

/* Apply a {name: cssColor} map onto the :root custom properties above. */
function setPageTheme(theme) {
  if (!theme) { return; }
  var root = document.documentElement;
  for (var key in theme) {
    if (Object.prototype.hasOwnProperty.call(theme, key)) {
      root.style.setProperty('--' + key, theme[key]);
    }
  }
}

/* ── Map legend (bottom-left) ────────────────────────────────────
   Entries come from gui/palette.py's LEGEND_ENTRIES, pushed alongside the
   colours themselves so the swatches can never drift out of sync with what
   is actually drawn (Line/Arc/Spiral hues + the OSM-reference dash style). */
var _legendControl = null;
var _legendEntries = [];
var _legendVisible = true;

function _buildLegendHtml(entries) {
  var rows = (entries || []).map(function(e) {
    var swatch;
    if (e.dashed) {
      swatch = '<span class="legend-swatch legend-swatch-dashed" ' +
               'style="border-top-color:' + e.color + ';"></span>';
    } else {
      swatch = '<span class="legend-swatch" style="background:' + e.color + ';"></span>';
    }
    return '<div class="legend-row">' + swatch +
           '<span class="legend-label">' + e.label + '</span></div>';
  }).join('');
  return '<div class="aln-tip legend-box">' + rows + '</div>';
}

function setLegend(entries, visible) {
  _legendEntries = entries || _legendEntries;
  if (visible !== undefined) { _legendVisible = !!visible; }
  if (_legendControl) { map.removeControl(_legendControl); _legendControl = null; }
  if (!_legendVisible || !_legendEntries.length) { return; }
  var Legend = L.Control.extend({
    options: { position: 'bottomleft' },
    onAdd: function() {
      var div = L.DomUtil.create('div');
      div.innerHTML = _buildLegendHtml(_legendEntries);
      L.DomEvent.disableClickPropagation(div);
      return div;
    }
  });
  _legendControl = new Legend();
  _legendControl.addTo(map);
}

function _fmtTooltip(seg) {
  var p = seg.params || {};
  var deg = function(rad) { return (rad * 180.0 / Math.PI).toFixed(2); };
  var num = function(v, n) { if (v === undefined || v === null) return "—"; return Number(v).toFixed(n === undefined ? 2 : n); };
  var staEnd = (p.sta_start || 0) + (p.length || 0);
  if (seg.type === "Line") {
    return "<b>Line</b><br>" +
           "Length: "      + num(p.length)         + " m<br>" +
           "Station: "     + num(p.sta_start)      + " → " + num(staEnd) + " m<br>" +
           "Direction: "   + (p.direction_rad !== undefined ? deg(p.direction_rad) + "°" : "—");
  } else if (seg.type === "Arc") {
    var defl = (p._deflection !== undefined) ? deg(p._deflection) : (p.deflection_deg !== undefined ? num(p.deflection_deg) : "—");
    return "<b>Arc</b><br>" +
           "Length: "      + num(p.length)         + " m<br>" +
           "Radius: "      + num(p.radius)         + " m<br>" +
           "Deflection: "  + defl                  + "°<br>" +
           "Rotation: "    + (p.rot || "—")        + "<br>" +
           "Station: "     + num(p.sta_start)      + " → " + num(staEnd) + " m";
  } else if (seg.type === "Spiral") {
    var rs = (p.radius_start === null || p.radius_start === undefined) ? "∞" : num(p.radius_start) + " m";
    var re = (p.radius_end   === null || p.radius_end   === undefined) ? "∞" : num(p.radius_end)   + " m";
    return "<b>Spiral (clothoid)</b><br>" +
           "Length: "      + num(p.length)         + " m<br>" +
           "Parameter A: " + num(p.clothoid_A)     + " m<br>" +
           "Radius: "      + rs + " → " + re        + "<br>" +
           "Rotation: "    + (p.rot || "—")        + "<br>" +
           "Station: "     + num(p.sta_start)      + " → " + num(staEnd) + " m";
  }
  return "<b>" + seg.type + "</b>";
}

function _fmtStatsPopup(seg) {
  var p = seg.params || {};
  var num = function(v, n) { if (v === undefined || v === null) return "—"; return Number(v).toFixed(n === undefined ? 2 : n); };
  var eid = p.element_id || "?";
  var staEnd = (p.sta_start || 0) + (p.length || 0);
  var html = "<b>" + eid + " · " + seg.type + "</b><br>" +
             "Length: "  + num(p.length)  + " m<br>" +
             "Station: " + num((p.sta_start||0)/1000, 3) + " → " + num(staEnd/1000, 3) + " km<br>";
  if (seg.type === "Arc") {
    html += "Radius: " + num(p.radius) + " m<br>";
    if (p._deflection !== undefined && p._deflection !== null)
      html += "Deflection: " + num(p._deflection * 180 / Math.PI) + "°<br>";
  }
  if (seg.type === "Spiral") {
    var rs = (p.radius_start === null || p.radius_start === undefined) ? "∞" : num(p.radius_start, 0);
    var re = (p.radius_end   === null || p.radius_end   === undefined) ? "∞" : num(p.radius_end, 0);
    html += "A: " + num(p.clothoid_A) + " m · R: " + rs + " → " + re + "<br>";
  }
  html += "<span style='color:var(--muted)'>Deviation vs OSM — max: " + num(p._max_dev) +
          " m · mean: " + num(p._mean_dev) + " m</span>";
  return html;
}

function _clearHover() {
  if (_hoverTimer) { clearTimeout(_hoverTimer); _hoverTimer = null; }
  if (_hoverPopup) { try { map.closePopup(_hoverPopup); } catch(e){} _hoverPopup = null; }
}

/* Glow layers are created ON DEMAND (hover / selection) instead of one per
   element: a 600-element alignment used to allocate 1 200 polylines up front. */
function _ensureGlow(entry) {
  if (!entry.glow) {
    entry.glow = L.polyline(entry.pts, {
      color: entry.col, weight: 13, opacity: 0.0,
      pane: 'alignmentGlowPane', renderer: _glowRenderer,
      interactive: false
    }).addTo(map);
    alignmentLayers.push(entry.glow);
  }
  return entry.glow;
}

function _emphasize(entry, on, weight) {
  if (on) {
    var w = weight || 7;
    entry.main.setStyle({weight: w, opacity: 1.0});
    // A selected element (weight 8, from highlightElements) reads more
    // prominently than a plain hover (weight 7) — its glow is brighter and
    // brought to the front of the glow canvas so overlapping selections
    // don't bury it under an unselected element's hover glow.
    var selected = w >= 8;
    var glow = _ensureGlow(entry);
    glow.setStyle({opacity: selected ? 0.6 : 0.5});
    if (selected) { try { glow.bringToFront(); } catch(e){} }
  } else {
    entry.main.setStyle({weight: 4, opacity: 0.95});
    /* Remove (don't just hide) the glow: an invisible glow polyline still
       sits in the canvas draw list, and hovering across hundreds of
       elements used to accumulate them for the rest of the session. */
    if (entry.glow) {
      try { map.removeLayer(entry.glow); } catch(e){}
      var gi = alignmentLayers.indexOf(entry.glow);
      if (gi >= 0) alignmentLayers.splice(gi, 1);
      entry.glow = null;
    }
  }
}

var alignEntries = [];   /* ordered entries, parallel to the segments payload */

function _rebuildSegIndex() {
  segIndex = {};
  alignEntries.forEach(function(e){ if (e.eid) segIndex[e.eid] = e; });
}

/* Create the polyline + handlers for one segment. Handlers and the tooltip
   read from the mutable entry (entry.seg / entry.eid), so a diff update can
   retarget a kept layer by assigning those fields — no rebinding needed. */
function _addSegmentLayer(seg) {
  var pts = (seg.points || []).map(function(n){ return [n[0], n[1]]; });
  if (pts.length < 2) return null;
  /* seg.color (Req 9b: deviation heatmap mode) overrides the type-based
     colour when Python sends one — hover/click/highlight are unaffected,
     they all key off entry.eid, never colour. */
  var col = seg.color || ELEMENT_COLOR[seg.type] || MAP_COLORS.elementFallback;
  /* Coloured main element (canvas-rendered: far cheaper for many paths) */
  var pl = L.polyline(pts, {
    color: col, weight: 4, opacity: 0.95,
    pane: 'alignmentPane', renderer: _alnRenderer
  }).addTo(map);
  var entry = {main: pl, glow: null, pts: pts, col: col, selected: false,
               seg: seg, eid: (seg.params || {}).element_id || null};
  pl.bindTooltip(function(){ return _fmtTooltip(entry.seg); },
                 {sticky: true, direction: 'top', className: 'aln-tip'});

  /* Hover: immediate glow; after 3 s an ID + statistics popup.
     Selected elements keep their emphasized style on mouseout. */
  pl.on('mouseover', function(ev) {
    _emphasize(entry, true, 7);
    _clearHover();
    var at = ev.latlng;
    _hoverTimer = setTimeout(function() {
      _hoverPopup = L.popup({closeButton: false, className: 'aln-tip', autoPan: false})
        .setLatLng(at)
        .setContent(_fmtStatsPopup(entry.seg))
        .openOn(map);
    }, 3000);
  });
  pl.on('mouseout', function() {
    if (entry.selected) _emphasize(entry, true, 8);
    else                _emphasize(entry, false);
    _clearHover();
  });

  /* Click: select this element in the table below.
     Ctrl+click toggles it into a multi-selection (for PI-range merge). */
  pl.on('click', function(ev) {
    L.DomEvent.stopPropagation(ev);
    if (_stationClickMode) {
      /* Station placement takes priority: forward the click instead */
      if (backend && backend.on_map_clicked)
        backend.on_map_clicked(ev.latlng.lat, ev.latlng.lng);
      return;
    }
    if (_splitClickMode) {
      if (backend && backend.on_split_point_clicked)
        backend.on_split_point_clicked(ev.latlng.lat, ev.latlng.lng);
      return;
    }
    if (!entry.eid) return;
    var ctrl = !!(ev.originalEvent &&
                  (ev.originalEvent.ctrlKey || ev.originalEvent.metaKey));
    if (backend && backend.on_element_clicked)
      backend.on_element_clicked(entry.eid, ctrl);
  });
  return entry;
}

function showAlignmentSegmented(segments, fitView) {
  if (fitView === undefined) fitView = true;
  clearAlignment();
  var all = [];
  segments.forEach(function(seg) {
    var entry = _addSegmentLayer(seg);
    if (!entry) return;
    all = all.concat(entry.pts);
    alignmentLayers.push(entry.main);
    alignEntries.push(entry);
  });
  _rebuildSegIndex();
  _recomputeHighlighted();
  if (all.length && fitView)
    try { map.flyToBounds(L.latLngBounds(all), {padding:[30,30], duration:0.8}); } catch(e){}
}

function _segGeomEqual(entry, seg) {
  var pts = seg.points || [];
  if (entry.seg.type !== seg.type) return false;
  if (entry.pts.length !== pts.length) return false;
  var a0 = entry.pts[0], b0 = pts[0];
  var a1 = entry.pts[entry.pts.length - 1], b1 = pts[pts.length - 1];
  var eps = 1e-9;
  return Math.abs(a0[0]-b0[0]) < eps && Math.abs(a0[1]-b0[1]) < eps &&
         Math.abs(a1[0]-b1[0]) < eps && Math.abs(a1[1]-b1[1]) < eps;
}

/* Diff update after an edit: keep layers whose geometry is unchanged
   (common prefix/suffix), recreate only the edited middle span, and
   refresh kept entries' seg/eid (ids and stations shift after merges).
   Falls back to a full redraw if the arrays cannot be kept parallel. */
function updateAlignmentSegmented(segments) {
  if (!alignEntries.length) {
    showAlignmentSegmented(segments, false);
    return;
  }
  var nOld = alignEntries.length, nNew = segments.length;
  var lim = Math.min(nOld, nNew);
  var p = 0;
  while (p < lim && _segGeomEqual(alignEntries[p], segments[p])) p++;
  var s = 0;
  while (s < lim - p &&
         _segGeomEqual(alignEntries[nOld-1-s], segments[nNew-1-s])) s++;

  var removed = alignEntries.splice(p, nOld - p - s);
  removed.forEach(function(e){
    try { map.removeLayer(e.main); } catch(err){}
    if (e.glow) try { map.removeLayer(e.glow); } catch(err){}
  });
  var inserted = [];
  for (var q = p; q < nNew - s; q++) {
    var entry = _addSegmentLayer(segments[q]);
    if (entry) inserted.push(entry);
  }
  Array.prototype.splice.apply(alignEntries, [p, 0].concat(inserted));
  if (alignEntries.length !== nNew) {       /* degenerate segment — bail out */
    showAlignmentSegmented(segments, false);
    return;
  }
  for (var i = 0; i < nNew; i++) {          /* retarget kept entries */
    if (i >= p && i < p + inserted.length) continue;
    alignEntries[i].seg = segments[i];
    alignEntries[i].eid = (segments[i].params || {}).element_id || null;
  }
  /* rebuild the flat layer list (glows included) + the id index */
  alignmentLayers = [];
  alignEntries.forEach(function(e){
    alignmentLayers.push(e.main);
    if (e.glow) alignmentLayers.push(e.glow);
  });
  _rebuildSegIndex();
  _recomputeHighlighted();
}

/* Span-local patch after a `rebuild_pi_span` edit (PI drag, radius/spiral
   edit, merge, omit, …): Python already knows the exact splice — replace
   alignEntries[start:start+deleteCount] with newSegments (full geometry),
   and retarget every OTHER entry FROM `start` ONWARD's tooltip/params from
   the parallel `metas` list (ids/stations shift for everything after the
   edit point even when an element's own geometry didn't move). `metas`
   covers new-list indices [start, end) only — entries before `start` are
   untouched by construction and were never sent. Returns false on a
   bookkeeping mismatch so the caller can fall back to a full update — this
   is a rare defensive path since MapWidget already checks its own entry
   count before calling. */
function patchAlignmentSegmented(start, deleteCount, newSegments, metas) {
  var removed = alignEntries.splice(start, deleteCount);
  removed.forEach(function(e){
    try { map.removeLayer(e.main); } catch(err){}
    if (e.glow) try { map.removeLayer(e.glow); } catch(err){}
  });
  var inserted = [];
  for (var q = 0; q < newSegments.length; q++) {
    var entry = _addSegmentLayer(newSegments[q]);
    if (entry) inserted.push(entry);
  }
  Array.prototype.splice.apply(alignEntries, [start, 0].concat(inserted));
  if (alignEntries.length !== start + metas.length) {
    return false;    // desync — caller falls back to a full redraw
  }
  for (var i = 0; i < metas.length; i++) {
    if (i < inserted.length) continue;   // just built — metas[0] aligns with alignEntries[start]
    var idx = start + i;
    alignEntries[idx].seg = metas[i];
    alignEntries[idx].eid = (metas[i].params || {}).element_id || null;
  }
  alignmentLayers = [];
  alignEntries.forEach(function(e){
    alignmentLayers.push(e.main);
    if (e.glow) alignmentLayers.push(e.glow);
  });
  _rebuildSegIndex();
  _recomputeHighlighted();
  return true;
}

/* Emphasize the selected elements (called from Python on every table
   selection change). Accepts an array of ids or a single id string.
   Diff-based: only entries whose highlight state actually changes are
   touched — the old all-entries setStyle sweep grew the canvas redraw
   bounds to the whole line on every selection change. */
var _highlightedIds = {};
function _recomputeHighlighted() {
  _highlightedIds = {};
  alignEntries.forEach(function(e){
    if (e.selected && e.eid) _highlightedIds[e.eid] = true;
  });
}
function highlightElements(elementIds) {
  if (typeof elementIds === 'string') elementIds = [elementIds];
  var wanted = {};
  (elementIds || []).forEach(function(id) { wanted[id] = true; });
  var touch = {};
  Object.keys(_highlightedIds).forEach(function(k){ touch[k] = true; });
  Object.keys(wanted).forEach(function(k){ touch[k] = true; });
  Object.keys(touch).forEach(function(k) {
    var e = segIndex[k];
    if (!e) return;
    e.selected = !!wanted[k];
    _emphasize(e, e.selected, 8);   // creates the glow lazily, only if needed
    if (e.selected) {
      try { e.main.bringToFront(); } catch(err){}
    }
  });
  _highlightedIds = wanted;
  var firstSel = null;
  (elementIds || []).some(function(id){
    if (segIndex[id]) { firstSel = segIndex[id]; return true; }
    return false;
  });
  if (firstSel) {
    try {
      var b = firstSel.main.getBounds();
      if (!map.getBounds().contains(b)) map.panTo(b.getCenter());
    } catch(e){}
  }
}

/* Backwards-compatible single-element variant */
function highlightElement(elementId) {
  highlightElements(elementId ? [elementId] : []);
}

/* ── PI overlay: markers + dashed virtual tangent extensions ───── */
var _piEditMode = false;   // Part C: draggable PIs in Refine/Consolidate
var _lastPIPayload = null; // re-rendered by setPIEditMode without a Python round-trip
/* Part H: per-PI lock state, id -> bool. Absent/true = locked (default —
   every re-entry into Edit mode starts fully locked, see setPIEditMode).
   Only an UNLOCKED PI is actually draggable; locked ones still bounce on
   hover (pure CSS) as a "this is interactive, unlock me" affordance. */
var _piLocked = {};

/* Part I: live preview while dragging. Throttled to ~20/sec in the 'drag'
   handler above; setLiveDragPreview(false) turns it off entirely (Python
   pref) — only dragend then updates anything, exactly as before this
   feature existed. */
var _liveDragPreviewEnabled = true;
var _lastDragPreview = 0;
function setLiveDragPreview(on) { _liveDragPreviewEnabled = !!on; }

/* Small divIcon standing in for a draggable marker — Leaflet's CircleMarker
   has no built-in drag support, only L.marker does. Composed of a dot (the
   plain non-edit-mode look), a lock/unlock badge (click to toggle — this is
   what actually gates dragging), and — only while unlocked — a restore
   badge that snaps the PI back to the fitted-alignment baseline. */
function _piDragIcon(omitted, locked) {
  var border = omitted ? MAP_COLORS.piOmitted : MAP_COLORS.piBorder;
  var fill   = omitted ? 'transparent' : MAP_COLORS.piFill;
  var html = '<div class="pi-dot" style="border:2px solid ' + border +
             ';background:' + fill + ';cursor:' + (locked ? 'default' : 'grab') + ';"></div>' +
             '<div class="pi-badge pi-lock-badge' + (locked ? '' : ' unlocked') +
             '" title="' + (locked ? 'Locked — click to unlock' : 'Unlocked — click to lock') +
             '">' + (locked ? '🔒' : '🔓') + '</div>';
  if (!locked) {
    html += '<div class="pi-badge pi-restore-badge" title="Restore to fitted position">↺</div>';
  }
  return L.divIcon({ className: 'pi-drag-icon', html: html,
                     iconSize: [22, 22], iconAnchor: [11, 11] });
}

/* (Re)bind the lock/restore badge click handlers on a marker's CURRENT DOM
   element — setIcon() replaces that element, so this must be re-run after
   every _setPILocked() as well as at creation time. */
function _bindPIMarkerBadges(mk, pi) {
  var el = mk.getElement();
  if (!el) return;
  var lockBadge = el.querySelector('.pi-lock-badge');
  if (lockBadge) {
    L.DomEvent.disableClickPropagation(lockBadge);
    L.DomEvent.on(lockBadge, 'click', function(ev) {
      L.DomEvent.stop(ev);
      var wasLocked = _piLocked[pi.id] !== false;
      _setPILocked(mk, pi, !wasLocked);
    });
  }
  var restoreBadge = el.querySelector('.pi-restore-badge');
  if (restoreBadge) {
    L.DomEvent.disableClickPropagation(restoreBadge);
    L.DomEvent.on(restoreBadge, 'click', function(ev) {
      L.DomEvent.stop(ev);
      if (backend && backend.on_pi_restore_requested)
        backend.on_pi_restore_requested(pi.id);
    });
  }
}

/* Toggle ONE PI's lock state in place — icon, drag capability, tooltip and
   badge bindings only. Used to full-rebuild EVERY PI marker on the map for
   a single padlock click. */
function _setPILocked(mk, pi, newLocked) {
  _piLocked[pi.id] = newLocked;
  var omitted = !!pi.omitted;
  mk.setIcon(_piDragIcon(omitted, newLocked));
  if (mk.dragging) { newLocked ? mk.dragging.disable() : mk.dragging.enable(); }
  var d = (pi.defl_deg === undefined || pi.defl_deg === null)
          ? "" : " · δ=" + Number(pi.defl_deg).toFixed(1) + "°";
  var tip = "PI " + pi.id + d + (omitted ? " (omitted)" : "") +
            (newLocked ? " — click the lock to unlock" : " — drag to move");
  if (mk.setTooltipContent) mk.setTooltipContent(tip);
  _bindPIMarkerBadges(mk, pi);
}

function showPIOverlay(payload) {
  clearPIOverlay();
  _lastPIPayload = payload || null;
  if (!payload) return;
  (payload.tangents || []).forEach(function(t) {
    var pl = L.polyline([t.from, t.to], {
      color: MAP_COLORS.piOmitted, weight: 2, opacity: 0.55,
      dashArray: '6 6', pane: 'piPane', renderer: _piRenderer
    }).addTo(map);
    pl._isTangent = true;
    piLayers.push(pl);
  });
  (payload.pis || []).forEach(function(pi) {
    var omitted = !!pi.omitted;
    var d = (pi.defl_deg === undefined || pi.defl_deg === null)
            ? "" : " · δ=" + Number(pi.defl_deg).toFixed(1) + "°";
    var mk;
    if (_piEditMode) {
      var locked = _piLocked[pi.id] !== false;
      var tip = "PI " + pi.id + d + (omitted ? " (omitted)" : "") +
                (locked ? " — click the lock to unlock" : " — drag to move");
      mk = L.marker(pi.latlon, {
        icon: _piDragIcon(omitted, locked), draggable: !locked,
        pane: 'piPane', autoPan: true,
      }).addTo(map);
      mk._piId = pi.id;
      mk.on('dragstart', function() {
        if (!_liveDragPreviewEnabled) return;
        if (backend && backend.on_pi_drag_start) backend.on_pi_drag_start(pi.id);
      });
      mk.on('drag', function() {
        if (!_liveDragPreviewEnabled) return;
        var now = Date.now();
        if (now - _lastDragPreview < 50) return;   // ~20 updates/sec cap
        _lastDragPreview = now;
        var ll = mk.getLatLng();
        if (backend && backend.on_pi_drag_preview)
          backend.on_pi_drag_preview(pi.id, ll.lat, ll.lng);
      });
      mk.on('dragend', function() {
        var ll = mk.getLatLng();
        if (backend && backend.on_pi_dragged)
          backend.on_pi_dragged(pi.id, ll.lat, ll.lng);
      });
      mk.bindTooltip(tip, {direction: 'top', className: 'aln-tip'});
      _bindPIMarkerBadges(mk, pi);
      piLayers.push(mk);
      return;
    }
    mk = L.circleMarker(pi.latlon, {
      radius: 5, color: omitted ? MAP_COLORS.piOmitted : MAP_COLORS.piBorder, weight: 2,
      fillColor: omitted ? 'transparent' : MAP_COLORS.piFill,
      fillOpacity: omitted ? 0.0 : 0.9, pane: 'piPane', renderer: _piRenderer,
    }).addTo(map);
    mk._piId = pi.id;
    mk.bindTooltip("PI " + pi.id + d + (omitted ? " (omitted)" : ""),
                   {direction: 'top', className: 'aln-tip'});
    piLayers.push(mk);
  });
}

/* Move ONE PI marker in place (during/after a drag) instead of tearing down
   and recreating every marker — the old showPIOverlay(_lastPIPayload) full
   rebuild was also why the marker under the cursor visibly snapped. */
function movePIMarker(id, latlon) {
  if (_lastPIPayload) {
    (_lastPIPayload.pis || []).forEach(function(pi) {
      if (pi.id === id) pi.latlon = latlon;
    });
  }
  for (var i = 0; i < piLayers.length; i++) {
    var l = piLayers[i];
    if (l._piId === id && typeof l.setLatLng === 'function') {
      l.setLatLng(latlon);
      return;
    }
  }
}

/* Rebuild only the dashed virtual-tangent stubs, leaving PI markers alone. */
function updatePITangents(tangents) {
  var kept = [];
  piLayers.forEach(function(l) {
    if (l._isTangent) { try { map.removeLayer(l); } catch(e){} }
    else kept.push(l);
  });
  piLayers = kept;
  (tangents || []).forEach(function(t) {
    var pl = L.polyline([t.from, t.to], {
      color: MAP_COLORS.piOmitted, weight: 2, opacity: 0.55,
      dashArray: '6 6', pane: 'piPane', renderer: _piRenderer
    }).addTo(map);
    pl._isTangent = true;
    piLayers.push(pl);
  });
  if (_lastPIPayload) _lastPIPayload.tangents = tangents;
}

function clearPIOverlay() {
  piLayers.forEach(function(l){ try{ map.removeLayer(l); }catch(e){} });
  piLayers = [];
  _lastPIPayload = null;
  _piLocked = {};
}

/* Toggling edit mode re-renders the CURRENT PI set with the appropriate
   marker type — no need to re-fetch from Python. Leaving edit mode resets
   every PI back to locked, so re-entering it always starts safe. */
function setPIEditMode(on) {
  _piEditMode = !!on;
  if (!on) _piLocked = {};
  if (_lastPIPayload) showPIOverlay(_lastPIPayload);
}

/* ── Station markers + click-to-place mode ─────────────────────── */
function showStations(stations) {
  clearStations();
  (stations || []).forEach(function(s) {
    var mk = L.circleMarker(s.latlon, {
      radius: 7, color: MAP_COLORS.stationBorder, weight: 2,
      fillColor: MAP_COLORS.stationFill, fillOpacity: 0.95, pane: 'stationPane',
      renderer: _stationRenderer,
    }).addTo(map);
    mk.bindTooltip("🚉 " + (s.name || "?") +
                   " · km " + Number(s.km || 0).toFixed(3),
                   {direction: 'top', permanent: false, className: 'aln-tip'});
    stationLayers.push(mk);
  });
}

function clearStations() {
  stationLayers.forEach(function(l){ try{ map.removeLayer(l); }catch(e){} });
  stationLayers = [];
}

function setStationClickMode(on) {
  _stationClickMode = !!on;
  map.getContainer().style.cursor = on ? 'crosshair' : '';
}

function setSplitClickMode(on) {
  _splitClickMode = !!on;
  map.getContainer().style.cursor = on ? 'crosshair' : '';
}

/* ── Vertical-profile hover link (Step 8) ──────────────────────────
   One dot on the track. Python moves it to the station under the profile
   cursor (setTrackCursor); the reverse direction reports the station under
   the mouse back to Python while the mouse is near the alignment, so the
   profile crosshair follows. The link is the (s, lat, lon) polyline from
   geometry.profile.chainage_lookup, set only while Step 8 is open. */
var _trackCursor        = null;
var _profileLink        = null;    // {s: [], lat: [], lon: []}
var _profileLinkActive  = false;   // the dot is following the mouse
var _profileLinkPending = null;
var _profileLinkTimer   = null;
var PROFILE_LINK_THROTTLE_MS = 40;
var PROFILE_LINK_SNAP_PX     = 18;

function setTrackCursor(lat, lon) {
  if (_trackCursor === null) {
    _trackCursor = L.circleMarker([lat, lon], {
      radius: 7, weight: 3, interactive: false,
      color: MAP_COLORS.profileCursor || '#2f6fb5',
      fillColor: MAP_COLORS.profileCursorFill || '#ffffff', fillOpacity: 1.0,
      pane: 'cursorPane', renderer: _cursorRenderer
    }).addTo(map);
  } else {
    _trackCursor.setLatLng([lat, lon]);
  }
}

function clearTrackCursor() {
  if (_trackCursor !== null) { try { map.removeLayer(_trackCursor); } catch(e){} }
  _trackCursor = null;
}

function setProfileLink(link) {
  _profileLink = (link && link.s && link.s.length > 1) ? link : null;
  _profileLinkActive = false;
}

function clearProfileLink() {
  _profileLink = null;
  _profileLinkActive = false;
  _profileLinkPending = null;
  clearTrackCursor();
}

/* Station and position on the link polyline nearest to latlng, projected
   per segment in a local frame where cos(lat) scales the longitude. */
function _nearestOnProfileLink(latlng) {
  var s = _profileLink.s, la = _profileLink.lat, lo = _profileLink.lon;
  var k = Math.cos(latlng.lat * Math.PI / 180);
  var px = latlng.lng * k, py = latlng.lat;
  var bestI = -1, bestT = 0, bestD = Infinity;
  for (var i = 0; i + 1 < s.length; i++) {
    var ax = lo[i] * k, ay = la[i];
    var dx = lo[i + 1] * k - ax, dy = la[i + 1] - ay;
    var len2 = dx * dx + dy * dy;
    var t = len2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    var ex = px - (ax + t * dx), ey = py - (ay + t * dy);
    var d = ex * ex + ey * ey;
    if (d < bestD) { bestD = d; bestI = i; bestT = t; }
  }
  if (bestI < 0) return null;
  return { s:   s[bestI]  + bestT * (s[bestI + 1]  - s[bestI]),
           lat: la[bestI] + bestT * (la[bestI + 1] - la[bestI]),
           lon: lo[bestI] + bestT * (lo[bestI + 1] - lo[bestI]) };
}

function _profileLinkLeave() {
  if (!_profileLinkActive) return;
  _profileLinkActive = false;
  clearTrackCursor();
  if (backend && backend.on_alignment_hover) backend.on_alignment_hover(-1.0);
}

function _profileLinkMove(ev) {
  var hit = _nearestOnProfileLink(ev.latlng);
  if (hit) {
    var at = map.latLngToContainerPoint([hit.lat, hit.lon]);
    if (at.distanceTo(ev.containerPoint) <= PROFILE_LINK_SNAP_PX) {
      _profileLinkActive = true;
      setTrackCursor(hit.lat, hit.lon);
      if (backend && backend.on_alignment_hover) backend.on_alignment_hover(hit.s);
      return;
    }
  }
  _profileLinkLeave();
}

/* Trailing throttle: the newest mouse position is handled once per
   PROFILE_LINK_THROTTLE_MS, so the last move (e.g. off the track) is
   never dropped. */
map.on('mousemove', function(ev) {
  if (!_profileLink) return;
  _profileLinkPending = ev;
  if (_profileLinkTimer !== null) return;
  _profileLinkTimer = setTimeout(function() {
    _profileLinkTimer = null;
    var e = _profileLinkPending;
    _profileLinkPending = null;
    if (e && _profileLink) _profileLinkMove(e);
  }, PROFILE_LINK_THROTTLE_MS);
});

map.on('mouseout', function() {
  _profileLinkPending = null;
  _profileLinkLeave();
});

map.on('click', function(ev) {
  if (_stationClickMode && backend && backend.on_map_clicked) {
    backend.on_map_clicked(ev.latlng.lat, ev.latlng.lng);
  } else if (_splitClickMode && backend && backend.on_split_point_clicked) {
    backend.on_split_point_clicked(ev.latlng.lat, ev.latlng.lng);
  }
});

/* ── Candidate emphasis (Step 4 card hover) ────────────────────── */
function emphasizeCandidate(algoId) {
  Object.keys(candIndex).forEach(function(k) {
    var pair = candIndex[k];
    if (!pair) return;
    pair[0].setStyle({opacity: 0.15});
    pair[1].setStyle({weight: 4, opacity: algoId ? 0.35 : 0.9});
  });
  if (algoId && candIndex[algoId]) {
    var sel = candIndex[algoId];
    sel[0].setStyle({opacity: 0.3});
    sel[1].setStyle({weight: 7, opacity: 1.0});
    sel[1].bringToFront();
  }
}

function flyToAlignment() {
  var all = [];
  alignmentLayers.forEach(function(l){ try{ all=all.concat(l.getLatLngs()); }catch(e){} });
  if (all.length)
    try { map.flyToBounds(L.latLngBounds(all), {padding:[30,30], duration:0.8}); } catch(e){}
}

function clearAlignment() {
  alignmentLayers.forEach(function(l){ try{ map.removeLayer(l); }catch(e){} });
  alignmentLayers = [];
  alignEntries = [];
  segIndex = {};
  _highlightedIds = {};
  _clearHover();
}

/* ── Candidate overlays (one per algorithm) ──────────────────── */
function showCandidates(candidates) {
  clearCandidates();
  candidates.forEach(function(c) {
    var latlngs = c.nodes.map(function(n){ return [n[0], n[1]]; });
    if (latlngs.length < 2) return;
    /* Glow */
    var glow = L.polyline(latlngs, {color:MAP_COLORS.glow, weight:10, opacity:0.15,
                          pane:'candidatesPane'}).addTo(map);
    candidateLayers.push(glow);
    /* Main line */
    var pl = L.polyline(latlngs, {
      color:   c.color || MAP_COLORS.elementFallback,
      weight:  4,
      opacity: 0.9,
      pane:    'candidatesPane'
    }).addTo(map);
    pl.bindTooltip(c.label || '', {sticky: true});
    candidateLayers.push(pl);
    if (c.algo) candIndex[c.algo] = [glow, pl];
  });
}

function clearCandidates() {
  candidateLayers.forEach(function(l){
    try{ map.removeLayer(l); }catch(e){}
  });
  candidateLayers = [];
  candIndex = {};
}

/* ── Cross-section overlays (left / right, colour-coded) ──────── */
/* Consecutive same-colour samples are grouped into ONE multi-vertex canvas
   polyline per run — the old one-polyline-per-5m-sample-pair built ~20 000
   SVG paths on a 50 km line and made pan/zoom permanently stutter. */
function showCrossSection(leftPts, rightPts) {
  clearCrossSection();
  function buildLayer(pts) {
    var layer = L.layerGroup();
    var i = 0;
    while (i < pts.length - 1) {
      var color = pts[i][2];
      var run = [[pts[i][0], pts[i][1]]];
      var j = i;
      while (j < pts.length - 1 && pts[j][2] === color) {
        run.push([pts[j+1][0], pts[j+1][1]]);
        j++;
      }
      L.polyline(run, {color: color, weight: 4, opacity: 0.85,
                       pane: 'crossSectionPane', renderer: _csRenderer,
                       interactive: false}).addTo(layer);
      i = j;
    }
    return layer;
  }
  if (leftPts  && leftPts.length  > 0) csLeftLayer  = buildLayer(leftPts).addTo(map);
  if (rightPts && rightPts.length > 0) csRightLayer = buildLayer(rightPts).addTo(map);
}

function clearCrossSection() {
  if (csLeftLayer)  { try { map.removeLayer(csLeftLayer);  } catch(e) {} csLeftLayer  = null; }
  if (csRightLayer) { try { map.removeLayer(csRightLayer); } catch(e) {} csRightLayer = null; }
}

function clearAll() {
  showTracks([]);
  clearOSMReference();
  clearAlignment();
  clearCandidates();
  clearCrossSection();
  clearPIOverlay();
  clearStations();
  clearProfileLink();
}
</script>
